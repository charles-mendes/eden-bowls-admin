services:
  eden-bowls-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: ${VITE_ADMIN_API_BASE_URL}
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/qa-admin/}
    container_name: eden-bowls-admin-qa
    restart: unless-stopped
    ports:
      - "127.0.0.1:4174:80"
