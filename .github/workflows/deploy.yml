name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-qa-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Publicar painel no QA
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          envs: DEPLOY_SHA
          script: |
            set -eu

            APP_DIR=/var/www/html/new-application/eden-bowls-admin
            cd "$APP_DIR"

            git_cmd() {
              git -c safe.directory="$APP_DIR" "$@"
            }

            wait_http() {
              url="$1"
              i=0
              code=""
              while [ "$i" -lt 45 ]; do
                code="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "$url" || true)"
                if [ "$code" = "200" ]; then
                  echo "$url HTTP 200"
                  return 0
                fi
                i=$((i + 1))
                sleep 2
              done
              echo "$url não respondeu 200 (último código: ${code:-nenhum})"
              return 1
            }

            case "${DEPLOY_SHA:-}" in
              *[!0-9a-f]*|"")
                echo "DEPLOY_SHA ausente ou inválido."
                exit 1
                ;;
            esac
            if [ "${#DEPLOY_SHA}" -ne 40 ]; then
              echo "DEPLOY_SHA ausente ou inválido."
              exit 1
            fi

            echo "Publicando painel $DEPLOY_SHA"

            dirty="$(git_cmd status --porcelain --untracked-files=no)"
            if [ -n "$dirty" ]; then
              echo "Há alterações locais em arquivos versionados. O deploy parou para não sobrescrever o servidor."
              printf '%s\n' "$dirty"
              exit 1
            fi

            export GIT_TERMINAL_PROMPT=0
            git_cmd fetch origin main
            if ! git_cmd cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              git_cmd fetch --unshallow origin main 2>/dev/null || git_cmd fetch origin main
            fi
            if ! git_cmd merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
              echo "O commit $DEPLOY_SHA não está em origin/main."
              exit 1
            fi
            git_cmd checkout --detach "$DEPLOY_SHA"

            if [ ! -f .env ]; then
              echo "Arquivo .env não encontrado em $APP_DIR"
              exit 1
            fi

            docker compose --env-file .env -f docker-compose.admin.yml up -d --build
            wait_http http://127.0.0.1:4174/
            echo "Painel publicado em $DEPLOY_SHA"
